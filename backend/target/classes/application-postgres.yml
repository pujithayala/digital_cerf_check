spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${RDS_HOSTNAME:localhost}:${RDS_PORT:5432}/${RDS_DB_NAME:certiverify_db}}
    username: ${DB_USERNAME:${RDS_USERNAME:postgres}}
    password: ${DB_PASSWORD:${RDS_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
